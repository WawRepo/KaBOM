<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" aria-labelledby="kabom-logo-title">
  <title id="kabom-logo-title">KaBOM</title>

  <!-- Own dark background chip so the light wordmark reads correctly
       wherever this is dropped (a white GitHub README, a light-mode
       browser) — not relying on the viewer already being in dark mode. -->
  <rect x="0" y="0" width="320" height="200" rx="16" fill="#0f172a" />

  <!--
    The bomb's body is built out of little boxes on purpose — an SBOM
    (Software Bill of Materials) is a list of "boxes" of software parts.
    Colours match the freshness banner's own green/amber/red (see
    kabom/templates/base.html) — the joke is that a KaBOM instance with
    stale data is exactly the kind of thing that "goes off".
  -->
  <g>
    <!-- fuse: a curved line from the body up to a spark -->
    <path d="M 108 74 C 100 50, 130 44, 132 28"
          fill="none" stroke="#78716c" stroke-width="6" stroke-linecap="round" />

    <!-- spark burst at the end of the fuse -->
    <g transform="translate(140,20)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"
               fill="#f59e0b" />
      <circle cx="18" cy="-14" r="3" fill="#dc2626" />
      <circle cx="-14" cy="-16" r="2" fill="#dc2626" />
    </g>

    <!-- the body: little boxes, clipped to a circle -->
    <clipPath id="kabom-body-clip">
      <circle cx="108" cy="132" r="58" />
    </clipPath>
    <g clip-path="url(#kabom-body-clip)">
      <circle cx="108" cy="132" r="58" fill="#1e293b" />
      <g fill="#334155">
        <rect x="46.0" y="124.0" width="16" height="16" rx="3" />
        <rect x="64.0" y="88.0" width="16" height="16" rx="3" />
        <rect x="64.0" y="124.0" width="16" height="16" rx="3" />
        <rect x="64.0" y="160.0" width="16" height="16" rx="3" />
        <rect x="100.0" y="70.0" width="16" height="16" rx="3" />
        <rect x="100.0" y="106.0" width="16" height="16" rx="3" />
        <rect x="100.0" y="142.0" width="16" height="16" rx="3" />
        <rect x="100.0" y="178.0" width="16" height="16" rx="3" />
        <rect x="136.0" y="88.0" width="16" height="16" rx="3" />
        <rect x="136.0" y="124.0" width="16" height="16" rx="3" />
        <rect x="136.0" y="160.0" width="16" height="16" rx="3" />
        <rect x="154.0" y="124.0" width="16" height="16" rx="3" />
      </g>
      <g fill="#475569">
        <rect x="64.0" y="106.0" width="16" height="16" rx="3" />
        <rect x="64.0" y="142.0" width="16" height="16" rx="3" />
        <rect x="82.0" y="88.0" width="16" height="16" rx="3" />
        <rect x="82.0" y="124.0" width="16" height="16" rx="3" />
        <rect x="82.0" y="160.0" width="16" height="16" rx="3" />
        <rect x="100.0" y="88.0" width="16" height="16" rx="3" />
        <rect x="100.0" y="124.0" width="16" height="16" rx="3" />
        <rect x="100.0" y="160.0" width="16" height="16" rx="3" />
        <rect x="118.0" y="88.0" width="16" height="16" rx="3" />
        <rect x="118.0" y="106.0" width="16" height="16" rx="3" />
        <rect x="118.0" y="142.0" width="16" height="16" rx="3" />
        <rect x="118.0" y="160.0" width="16" height="16" rx="3" />
        <rect x="136.0" y="106.0" width="16" height="16" rx="3" />
        <rect x="136.0" y="142.0" width="16" height="16" rx="3" />
        <rect x="82.0" y="142.0" width="16" height="16" rx="3" />
      </g>
      <!-- one crate stamped "BOM", because the joke only lands if you look closely -->
      <rect x="99.0" y="123.0" width="18" height="18" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="108" y="135" font-family="'DejaVu Sans Mono', 'Courier New', monospace"
            font-size="8" font-weight="700" fill="#f59e0b" text-anchor="middle">BOM</text>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800">
    <text x="196" y="122" font-size="46" fill="#e2e8f0">Ka<tspan fill="#dc2626">BOM</tspan></text>
    <text x="198" y="146" font-size="13" font-weight="500" fill="#94a3b8" font-style="italic">
      your SBOMs, without the enterprise
    </text>
  </g>
</svg>
