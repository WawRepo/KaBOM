{% extends "base.html" %}
{% block title %}KaBOM — Search{% endblock %}
{% block content %}
  <div class="mx-auto max-w-3xl">
    <div class="mb-6 text-center">
      <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">
        Do we have this package, and where?
      </h1>
      <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
        Searches every ingested image and host at once.
      </p>
    </div>

    <!--
      Progressive enhancement, not a JS-only widget:

      - No JavaScript / htmx blocked: this is a plain <form method="get">. The
        browser submits it (Enter, or the visible Search button) as a normal
        GET to "/?q=...", the server renders this exact page with results
        filled in, full page load. Nothing here depends on JS to function.
      - htmx present: hx-trigger fires the same GET on every keystroke
        (debounced 300ms), hx-select carves the #search-results div back out
        of the full-page response, and hx-swap="outerHTML" drops it in place
        of the old one — so the exact same server route serves both cases,
        there is no separate JSON-for-the-UI endpoint to keep in sync.
    -->
    <form
      method="get"
      action="/"
      hx-get="/"
      hx-trigger="keyup changed delay:300ms from:#q, search from:#q"
      hx-select="#search-results"
      hx-target="#search-results"
      hx-swap="outerHTML"
      class="flex gap-2"
    >
      <label for="q" class="sr-only">Search for a package name</label>
      <div class="relative flex-1">
        <span aria-hidden="true" class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd" />
          </svg>
        </span>
        <input
          type="search"
          id="q"
          name="q"
          value="{{ q or '' }}"
          autofocus
          autocomplete="off"
          placeholder="libssl3, openssl, zlib…"
          class="w-full rounded-xl border border-slate-300 bg-white py-3.5 pl-11 pr-4 text-base shadow-sm outline-none transition placeholder:text-slate-400 focus:border-slate-900 focus:ring-4 focus:ring-slate-900/5 dark:border-slate-700 dark:bg-slate-900 dark:focus:border-slate-400 dark:focus:ring-slate-400/10"
        />
      </div>
      <button
        type="submit"
        class="shrink-0 rounded-xl bg-slate-900 px-5 py-3.5 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900/30 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-white"
      >Search</button>
    </form>

    {% include "_search_results.html" %}
  </div>
{% endblock %}
