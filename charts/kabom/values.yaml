# Default values for the kabom chart.
#
# This app has exactly one deployment, forever: one replica, one namespace
# (whatever the caller installs it into), one node (SQLite on a PVC pins it
# there anyway). Taking the simple option, none of that is a value here —
# there is nothing to configure because it never varies.

image:
  repository: ghcr.io/wawrepo/kabom
  tag: latest
  pullPolicy: IfNotPresent

# Ingress host. A placeholder — override it, there is no useful default.
ingress:
  host: kabom.example.com
  # Leave empty to use the cluster's default IngressClass.
  className: ""
  annotations: {}
  # TLS is off by default so `helm template`/`helm install` work with no
  # overrides. Turn it on and point secretName at whatever cert-manager (or
  # your own secret) provides the certificate for the real host.
  tls:
    enabled: false
    secretName: ""

# A single-user homelab app; these are generous headroom, not a tuned
# guess. Raise them only if the app is actually observed hitting them.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Storage for the SQLite database file (KABOM_DB_PATH, mounted at /data —
# see the Dockerfile).
#
# storageClass MUST provide real POSIX locking. SMB/CIFS does not, and
# SQLite corrupts on it, which rules out most NAS-backed classes — use a
# node-local provisioner. That pins this Pod to whichever node the volume
# was provisioned on; with one replica and a database rebuilt from the
# bucket in seconds, that is an accepted trade-off, not a bug.
persistence:
  storageClass: local-path
  size: 1Gi
  accessMode: ReadWriteOnce

# Plain (non-secret) KABOM_* environment variables. Actual credentials
# (S3 keys, the basic-auth password hash, Google OAuth client secret, the
# session secret, and — since they travel with those — the basic-auth
# username and Google OAuth client ID) come from the existing Kubernetes
# Secret named by `secretName` below, never from here.
env:
  s3Endpoint: ""
  s3Bucket: ""
  dbPath: /data/kabom.sqlite3
  refreshMinutes: 60
  # "basic" or "google" — see kabom/auth.py.
  authMode: basic
  # Comma-separated allow-list, only read when authMode is "google". Not a
  # secret (it's a list of email addresses, not a credential), so it lives
  # here rather than in the Secret.
  allowedEmails: ""

# Name of an EXISTING Kubernetes Secret, holding whichever of these keys the
# chosen authMode needs:
#   KABOM_S3_ACCESS_KEY, KABOM_S3_SECRET_KEY        (always)
#   KABOM_BASIC_USER, KABOM_BASIC_PASSWORD_HASH     (authMode: basic)
#   KABOM_GOOGLE_CLIENT_ID, KABOM_GOOGLE_CLIENT_SECRET,
#   KABOM_SESSION_SECRET                            (authMode: google)
# This chart only references it by name (envFrom.secretRef) — it never
# creates, reads, or templates the Secret's contents, so whatever you use to
# manage secrets (SOPS, Sealed Secrets, an external operator) keeps owning
# them.
secretName: kabom-secrets
