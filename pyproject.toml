[project]
name = "kabom"
version = "0.1.0"
description = "Your SBOMs, without the enterprise."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "authlib>=1.7.2",
    "bcrypt>=5.0.0",
    "boto3>=1.43.80",
    "fastapi>=0.115",
    # authlib's starlette_client integration imports httpx unconditionally
    # (kabom/main.py imports it at module load, regardless of KABOM_AUTH) —
    # this must be a runtime dependency, not just test tooling.
    "httpx>=0.27",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "moto[s3]>=5.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kabom"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiom is `Depends(...)` as an argument default; B008 doesn't
# know that FastAPI calls it once per request, not once at import time.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
