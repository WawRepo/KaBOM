name: Release

# Publishes a multi-arch (linux/amd64 + linux/arm64) image to GHCR when a
# GitHub Release is published — not on every push to main, and not on a
# bare tag push either. A Release is a deliberate human act that always
# carries release notes, which a raw tag push does not guarantee.
#
# This is the only workflow that pushes a KaBOM image anywhere; ci.yml's
# `docker` job only builds, to catch a broken Dockerfile on every push.
#
# Auth uses the repo's own GITHUB_TOKEN (via `permissions: packages: write`
# below) — no new secret to create or rotate, per CLAUDE.md's "Secrets in
# env vars" trap.

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  # Matches the actual GitHub org/repo casing (git@github.com:WawRepo/KaBOM.git),
  # lowercased because image repository names on GHCR must be lowercase.
  IMAGE_NAME: wawrepo/kabom

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate the release tag is semantic versioning
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not vMAJOR.MINOR.PATCH — refusing to publish an image for it."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
