name: Release

# Publishes the image to GHCR when a GitHub Release is published — not on
# every push to main, and not on a bare tag push either. A Release is a
# deliberate human act that always carries release notes, which a raw tag
# push does not guarantee.
#
# This is the only workflow that pushes a KaBOM image anywhere; ci.yml's
# `image` job builds with --no-push, to catch a broken Dockerfile on every
# push.
#
# Built with Kaniko on the self-hosted ARC runner, in kubernetes mode: no
# Docker daemon and no privileged container. Auth uses the repo's own
# GITHUB_TOKEN, so there is no new secret to create or rotate.
#
# ⚠️  ARCHITECTURE: Kaniko builds for the architecture it runs on and
#     cannot cross-build, so this publishes an **arm64-only** image. It
#     will not start on an amd64 node — a single-arch image fails at
#     runtime, not at deploy. That is fine while KaBOM's SQLite PVC pins it
#     to one arm64 node; it stops being fine the moment it needs to land
#     anywhere else.

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  # Matches the actual GitHub org/repo casing (git@github.com:WawRepo/KaBOM.git),
  # lowercased because image repository names on GHCR must be lowercase.
  IMAGE_NAME: wawrepo/kabom

jobs:
  publish:
    runs-on: arc-k8s-kabom
    permissions:
      contents: read
      packages: write
    container:
      # The -debug tag is the one with a shell, which the Actions runner
      # needs to execute `run:` steps at all.
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
    steps:
      # Deliberately no actions/checkout: the Kaniko image has no Node, so
      # JavaScript actions cannot run in it. The tag is validated from the
      # event payload and Kaniko fetches the repo itself from the git
      # context below.
      - name: Validate the release tag is semantic versioning
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*)
              # Reject a trailing suffix that the glob above still admits,
              # e.g. v1.2.3-rc1 or v1.2.3.4.
              rest="${TAG#v}"
              case "$rest" in
                *[!0-9.]*|*.*.*.*) echo "::error::Release tag '$TAG' is not vMAJOR.MINOR.PATCH."; exit 1 ;;
              esac
              ;;
            *)
              echo "::error::Release tag '$TAG' is not vMAJOR.MINOR.PATCH — refusing to publish an image for it."
              exit 1
              ;;
          esac
          echo "Tag $TAG accepted."

      # TARGETARCH is passed explicitly — see ci.yml. Kaniko does not
      # provide BuildKit's automatic platform args, and arm64 is both what
      # this runner is and the only architecture kaniko can produce here.
      - name: Build and push to GHCR
        env:
          # See ci.yml: kaniko maps GIT_TOKEN to the username with an empty
          # password, which GitHub rejects. x-access-token + token is the
          # form that works for a private repo.
          GIT_USERNAME: x-access-token
          GIT_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          version="${TAG#v}"
          minor="${version%.*}"

          # Kaniko reads registry credentials from a docker config file
          # rather than a `docker login`, there being no daemon to log in to.
          mkdir -p /kaniko/.docker
          auth=$(printf '%s:%s' "${{ github.actor }}" "$GHCR_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$auth" > /kaniko/.docker/config.json

          /kaniko/executor \
            --context "git://github.com/${{ github.repository }}.git#refs/tags/${TAG}" \
            --dockerfile Dockerfile \
            --build-arg TARGETARCH=arm64 \
            --destination "$REGISTRY/$IMAGE_NAME:$version" \
            --destination "$REGISTRY/$IMAGE_NAME:$minor" \
            --destination "$REGISTRY/$IMAGE_NAME:latest" \
            --verbosity info
