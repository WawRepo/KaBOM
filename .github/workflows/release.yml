name: Release

# Cut a release by hand: Actions -> Release -> Run workflow. There is no
# tag to create and no version to think of — the last tag is read, the
# chosen part is bumped (patch unless you say otherwise), the release is
# created with generated notes, and the image is published to GHCR.
#
# Deliberately manual. Publishing an image is a decision, not something a
# push to main should do on its own. ci.yml's `image` job builds with
# --no-push on every push, so a broken Dockerfile is caught long before
# anyone reaches for this.
#
# ⚠️  ARCHITECTURE: Kaniko builds for the architecture it runs on and
#     cannot cross-build, so this publishes an **arm64-only** image. It
#     will not start on an amd64 node — a single-arch image fails at
#     runtime, not at deploy. Fine while KaBOM's SQLite PVC pins it to one
#     arm64 node; it stops being fine the moment it needs to land anywhere
#     else.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increase"
        type: choice
        options: [patch, minor, major]
        default: patch

env:
  REGISTRY: ghcr.io
  # Matches the actual GitHub org/repo casing (WawRepo/KaBOM), lowercased
  # because image repository names on GHCR must be lowercase.
  IMAGE_NAME: wawrepo/kabom

jobs:
  tag:
    # A normal runner, not the Kaniko container: this job needs Node for
    # the JavaScript actions below, and the Kaniko image has none.
    runs-on: arc-k8s-kabom
    permissions:
      # write: creates the release AND pushes the Chart.yaml stamp commit.
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are what the version is derived from, and a shallow clone
          # has none of them.
          fetch-depth: 0

      - name: Work out the next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -eu
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)

          if [ -z "$latest" ]; then
            # First release. Starts at v0.1.0 rather than v0.0.1: this is a
            # working app, not a patch to nothing.
            next="v0.1.0"
          else
            v="${latest#v}"
            major="${v%%.*}"
            rest="${v#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::Unknown bump '$BUMP'"; exit 1 ;;
            esac
            next="v${major}.${minor}.${patch}"
          fi

          echo "Last tag: ${latest:-none}. Releasing: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

      # Stamped into the repo BEFORE the tag is cut, so the tag contains a
      # chart that names the image this same release publishes. values.yaml
      # leaves image.tag empty and the Deployment falls back to
      # .Chart.AppVersion — a chart tagged with a version whose image was
      # never pushed installs straight into ImagePullBackOff.
      - name: Stamp the version into Chart.yaml and commit it
        id: stamp
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -eu
          sed -i -E "s/^version: .*/version: ${VERSION}/" charts/kabom/Chart.yaml
          sed -i -E "s/^appVersion: .*/appVersion: \"${VERSION}\"/" charts/kabom/Chart.yaml
          grep -E '^(version|appVersion):' charts/kabom/Chart.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/kabom/Chart.yaml
          # [skip ci] — this commit changes only a version string that CI
          # has already tested; re-running the whole suite on it is noise.
          git commit -m "chore(release): chart ${VERSION} [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create the tag and the release
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.next.outputs.tag }}
          SHA: ${{ steps.stamp.outputs.sha }}
        with:
          script: |
            // Tags the stamped commit, not the one the workflow started
            // from, so the tag's chart and its image agree.
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG,
              target_commitish: process.env.SHA,
              name: process.env.TAG,
              generate_release_notes: true,
            });
            core.info(`Released ${data.tag_name}: ${data.html_url}`);

  image:
    # Kaniko: no Docker daemon and no privileged container, which is what
    # makes this work on an ARC runner in kubernetes mode.
    needs: tag
    runs-on: arc-k8s-kabom
    permissions:
      contents: read
      packages: write
    container:
      # The -debug tag is the one with a shell, which the Actions runner
      # needs to execute `run:` steps at all.
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
    steps:
      # Deliberately no actions/checkout: the Kaniko image has no Node, so
      # JavaScript actions cannot run in it. Kaniko fetches the repo itself
      # from the git context below, pinned to the tag just created.
      #
      # TARGETARCH is passed explicitly because it is one of BuildKit's
      # automatic platform build args and Kaniko does not provide them —
      # the Dockerfile's `case "$TARGETARCH"` picks the Tailwind binary and
      # fails under `set -u` when it is empty.
      - name: Build and push to GHCR
        env:
          # Kaniko maps GIT_TOKEN to the *username* with an empty password,
          # which GitHub rejects. x-access-token + the token as password is
          # the form that works.
          GIT_USERNAME: x-access-token
          GIT_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -eu
          minor="${VERSION%.*}"

          # Kaniko reads registry credentials from a docker config file
          # rather than a `docker login`, there being no daemon to log in to.
          mkdir -p /kaniko/.docker
          auth=$(printf '%s:%s' "${{ github.actor }}" "$GHCR_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$auth" > /kaniko/.docker/config.json

          /kaniko/executor \
            --context "git://github.com/${{ github.repository }}.git#refs/tags/${TAG}" \
            --dockerfile Dockerfile \
            --build-arg TARGETARCH=arm64 \
            --destination "$REGISTRY/$IMAGE_NAME:$VERSION" \
            --destination "$REGISTRY/$IMAGE_NAME:$minor" \
            --destination "$REGISTRY/$IMAGE_NAME:latest" \
            --verbosity info

  chart:
    # The chart ships with the image, at the same version, to the same
    # registry. Helm speaks OCI natively, so GHCR needs nothing added —
    # no ChartMuseum, no gh-pages index, no second credential.
    needs: [tag, image]
    runs-on: arc-k8s-kabom
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag, not main: this must package the chart the release
          # actually points at.
          ref: ${{ needs.tag.outputs.tag }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push the chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eu
          # Belt and braces: the stamp step should already have done this,
          # so a mismatch here means something went wrong upstream.
          chart_version=$(helm show chart charts/kabom | awk '/^version:/{print $2}')
          if [ "$chart_version" != "$VERSION" ]; then
            echo "::error::Chart.yaml says $chart_version but the release is $VERSION"
            exit 1
          fi

          helm package charts/kabom --destination dist
          echo "$GHCR_TOKEN" | helm registry login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin
          helm push "dist/kabom-${VERSION}.tgz" "oci://$REGISTRY/${{ github.repository_owner }}/charts"

      - name: Attach the chart to the release
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          VERSION: ${{ needs.tag.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.TAG,
            });
            const name = `kabom-${process.env.VERSION}.tgz`;
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name,
              data: fs.readFileSync(`dist/${name}`),
            });
            core.info(`Attached ${name} to ${process.env.TAG}`);
