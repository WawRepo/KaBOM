name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  image:
    # Build only: `push: false` proves the Dockerfile is sound, for BOTH
    # architectures, on every push without publishing anything. Releases
    # are published separately (see release.yml).
    #
    # Multi-arch via buildx + QEMU: a single-arch image fails at runtime,
    # not at deploy, so both are built here exactly as release.yml does.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build image (both architectures, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    # Runs `docker compose up` (MinIO + KaBOM) and drives a real browser at
    # it. Needs a real container runtime, which the hosted runner has.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Playwright suite against docker compose
        env:
          PLAYWRIGHT_INSTALL_DEPS: "1"
        run: ./tests/e2e/run-e2e.sh

  helm:
    # Renders the chart with no live cluster involved — helm lint and helm
    # template are both purely local/offline. This never installs anything
    # anywhere; deploying the chart is the operator's job, not this repo's CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      # The manifest check below parses the rendered YAML, which needs
      # PyYAML. uv is how this repo gets Python dependencies anywhere —
      # same as the test job.
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: helm lint (default values)
        run: helm lint charts/kabom

      - name: helm template (default values)
        run: helm template kabom charts/kabom

      - name: helm template (google auth + TLS values, as an override sanity check)
        run: |
          helm template kabom charts/kabom \
            --set env.authMode=google \
            --set-string env.allowedEmails="a@example.com\,b@example.com" \
            --set ingress.tls.enabled=true \
            --set ingress.tls.secretName=kabom-tls

      # `helm lint` and `helm template` BOTH pass on a manifest whose
      # apiVersion has been swallowed by a stray `-}}` chomp — the text
      # renders, it just parses as a document with no apiVersion, which is
      # not a valid Kubernetes object and fails at whatever applies it.
      # That shipped as chart 0.1.3. Parsing the render is what catches it.
      - name: Rendered manifests are valid Kubernetes objects
        run: ./scripts/check-rendered-manifests.sh

      # `helm lint` passes on every one of these. Each renders a manifest
      # that installs cleanly and is wrong — a catch-all ingress, a fake TLS
      # certificate, a CrashLoopBackOff — so the chart turns them into
      # template errors and this proves it still does.
      - name: helm template rejects known-bad values
        run: |
          set -eu
          fails() {
            desc="$1"; shift
            if helm template kabom charts/kabom "$@" >/dev/null 2>&1; then
              echo "::error::chart accepted bad values it should reject: $desc"
              exit 1
            fi
            echo "rejected as expected: $desc"
          }
          fails "TLS on with no secretName (would serve the ingress controller's fake cert)" \
            --set ingress.tls.enabled=true
          fails "empty ingress.host (would install as a catch-all rule)" \
            --set-string ingress.host=""
          fails "authMode with wrong case (app refuses to start)" \
            --set env.authMode=Basic
          fails "refreshMinutes=0 (tight re-ingest loop, not 'disabled')" \
            --set env.refreshMinutes=0
          fails "google mode with no allow-list (would accept any Google account)" \
            --set env.authMode=google
