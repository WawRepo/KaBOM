name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # GitHub's hosted runners — this repo is not on the self-hosted ARC
    # fleet and does not need to be.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kabom:ci .

  e2e:
    # Playwright, driving a real browser against the docker-compose stack
    # (see docker-compose.yml, tests/e2e/, and the README's "End-to-end
    # tests" section). ubuntu-latest ships Docker + Compose v2 and Node
    # already, so this needs no extra setup beyond the OS browser deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Playwright suite against docker compose
        env:
          PLAYWRIGHT_INSTALL_DEPS: "1"
        run: ./tests/e2e/run-e2e.sh
