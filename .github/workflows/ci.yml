name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # GitHub's hosted runners — this repo is not on the self-hosted ARC
    # fleet and does not need to be.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t kabom:ci .

  e2e:
    # Playwright, driving a real browser against the docker-compose stack
    # (see docker-compose.yml, tests/e2e/, and the README's "End-to-end
    # tests" section). ubuntu-latest ships Docker + Compose v2 and Node
    # already, so this needs no extra setup beyond the OS browser deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Playwright suite against docker compose
        env:
          PLAYWRIGHT_INSTALL_DEPS: "1"
        run: ./tests/e2e/run-e2e.sh

  helm:
    # Renders the chart with no live cluster involved — helm lint and helm
    # template are both purely local/offline (see HOME-236). This never
    # installs anything anywhere; the chart's actual deploy is pi_cluster's
    # job via a helm_release, not this repo's CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: helm lint (default values)
        run: helm lint charts/kabom

      - name: helm template (default values)
        run: helm template kabom charts/kabom

      - name: helm template (google auth + TLS values, as an override sanity check)
        run: |
          helm template kabom charts/kabom \
            --set env.authMode=google \
            --set-string env.allowedEmails="a@example.com\,b@example.com" \
            --set ingress.tls.enabled=true \
            --set ingress.tls.secretName=kabom-tls
