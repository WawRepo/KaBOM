name: Dependabot auto-merge

# Merges a Dependabot PR once its own CI run (the "CI" workflow, triggered
# by the same PR) has actually finished and gone green — not GitHub's
# native "auto-merge" queue feature, which depends on branch protection
# requiring status checks. That needs a paid plan or a public repo (see
# HOME-237); this achieves the same "never merge on red" guarantee without
# it, by only acting once workflow_run reports conclusion == success.
#
# Runs with the base repo's token/permissions (workflow_run, not
# pull_request_target on a fork), which is safe here: Dependabot opens
# branches in this same repo for a same-owner project, never a fork.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh api "repos/$REPO/actions/runs/${{ github.event.workflow_run.id }}" \
            --jq '.pull_requests[0].number')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request associated with this run; nothing to merge."
            exit 0
          fi
          echo "Merging Dependabot PR #$PR_NUMBER (CI green)."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
